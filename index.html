<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un ramo para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;--bg:#03040c;--ink:#fff6d0;--soft:#e9dcab;--rose:#ffd23f;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none}
.bg{position:fixed;inset:0;background:
  radial-gradient(85% 50% at 50% 100%,rgba(255,196,40,.17),transparent 70%),
  radial-gradient(130% 90% at 50% 0%,#0e1436 0%,#060820 45%,#02030a 100%)}
.moon{position:fixed;z-index:1;left:18px;top:calc(env(safe-area-inset-top,0px) + 18px);width:38px;height:38px;border-radius:50%;
  box-shadow:inset -11px -4px 0 0 #ffe8d0;filter:drop-shadow(0 0 12px rgba(255,225,200,.55));transform:rotate(-20deg)}
canvas{position:fixed;inset:0;pointer-events:none}
#sky{z-index:1}#fx{z-index:5}
.stage{position:fixed;inset:0;z-index:2;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);pointer-events:none}
.top{text-align:center;animation:fade 1.8s .3s both}
.kicker{font-size:14px;color:var(--soft);opacity:.85}
h1{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic;font-weight:500;
  font-size:clamp(34px,9vw,54px);line-height:1.1;margin-top:4px;color:var(--ink);text-shadow:0 0 26px rgba(255,210,63,.65)}
.bq{min-height:0;display:flex;justify-content:center;align-items:flex-end;animation:rise 1.6s cubic-bezier(.2,.8,.2,1) both}
.bq svg{height:100%;width:100%;max-width:640px;overflow:visible;pointer-events:none}
.hd{pointer-events:all;cursor:pointer;outline:none}
.hd:focus-visible circle{stroke:#fff;stroke-width:2;stroke-dasharray:4 4}
.bot{text-align:center;padding-top:8px;animation:fade 1.8s 1s both}
.msg{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(19px,5vw,25px);line-height:1.35;
  min-height:2.75em;max-width:26ch;margin:0 auto;display:flex;align-items:center;justify-content:center;color:var(--ink);
  text-shadow:0 2px 18px rgba(0,0,0,.7)}
.msg.hint{animation:pulse 2.8s ease-in-out infinite}
.sub{font-size:16px;color:var(--soft);min-height:1.4em;opacity:0;transition:opacity 1s}
.sub.on{opacity:1}
.dots{display:flex;gap:9px;justify-content:center;margin:8px 0 12px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);transition:background .5s,box-shadow .5s,transform .5s}
.dots i.on{background:var(--rose);box-shadow:0 0 12px var(--rose);transform:scale(1.15)}
.row{display:flex;gap:14px;justify-content:center;align-items:center;min-height:54px;visibility:hidden;opacity:0;transition:opacity .6s}
.row.show{visibility:visible;opacity:1;pointer-events:auto}
.btn{font:700 17px 'Nunito',system-ui,sans-serif;white-space:nowrap;padding:13px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.09);color:#fff;cursor:pointer;touch-action:manipulation;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.yes{background:linear-gradient(135deg,#ffd75e,#e6a300);border-color:transparent;color:#3a2600;box-shadow:0 6px 28px rgba(255,196,40,.5);
  transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.no{position:relative;z-index:7;transition:transform .3s cubic-bezier(.3,1.4,.5,1),opacity .4s}
.snd{position:fixed;z-index:6;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font-size:17px;cursor:pointer;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.top,.bq,.bot,.msg.hint{animation:none}}
</style>
</head>

<path d="M296 740 C268 712 226 716 226 742 C228 760 268 758 296 740Z" fill="#c98d18" opacity=".55"/>
<path d="M304 740 C332 712 374 716 374 742 C372 760 332 758 304 740Z" fill="#c98d18" opacity=".55"/>
<rect x="288" y="724" width="24" height="32" rx="10" fill="#e8b23a"/>
<path d="M293 730 Q300 726 307 730" stroke="#fff" stroke-opacity=".5" stroke-width="2" fill="none" stroke-linecap="round"/>
</g>
</g>
</svg></div>
  <footer class="bot">
    <p class="msg hint" id="msg" aria-live="polite">Toca las rosas 🌹</p>
    <p class="sub" id="sub"></p>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="row" id="row"><button class="btn yes" id="yes">Sí 💗</button><button class="btn no" id="no">Lo pienso…</button></div>
  </footer>
</main>
<script>
(function(){
'use strict';
/* Personaliza aquí */
var CONFIG={para:'',de:''};

var lines=['Hola, tú 🌹 sí, tú.','No sé si fue tu sonrisa o tu forma de ser…','pero desde que te conocí mis días se ven mejor.','Estas flores no se marchitan (ventajas de ser código 😌)','Así que me armé de valor y… tengo una pregunta.'];
var QUESTION='¿Me dejas invitarte a salir?';

var $=function(s){return document.querySelector(s)};
var sky=$('#sky'),fx=$('#fx'),sc=sky.getContext('2d'),fc=fx.getContext('2d');
var W=0,H=0,DPR=1,stars=[],flies=[],hearts=[],shoots=[],parts=[];
var calm=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
if(CONFIG.para)$('#who').textContent='para '+CONFIG.para;

function mkSprite(c0,c1,c2){var c=document.createElement('canvas');c.width=c.height=64;var g=c.getContext('2d');
  var gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,c0);gr.addColorStop(.25,c1);gr.addColorStop(1,c2);
  g.fillStyle=gr;g.fillRect(0,0,64,64);return c}
var glowSprite=mkSprite('rgba(255,236,244,1)','rgba(255,170,205,.55)','rgba(255,140,190,0)');

function heartPath(c,s){c.beginPath();c.moveTo(0,s*.9);c.bezierCurveTo(-s*1.4,-s*.1,-s*.7,-s*1.1,0,-s*.45);c.bezierCurveTo(s*.7,-s*1.1,s*1.4,-s*.1,0,s*.9);c.closePath()}
function star4(c,s){c.beginPath();c.moveTo(0,-s);c.quadraticCurveTo(0,0,s,0);c.quadraticCurveTo(0,0,0,s);c.quadraticCurveTo(0,0,-s,0);c.quadraticCurveTo(0,0,0,-s);c.closePath()}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
  [sky,fx].forEach(function(c){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);c.style.width=W+'px';c.style.height=H+'px'});
  sc.setTransform(DPR,0,0,DPR,0,0);fc.setTransform(DPR,0,0,DPR,0,0);
  var n=Math.min(240,Math.round(W*H/3200)),i;stars=[];
  for(i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.85,r:Math.random()<.07?rnd(1.3,2):rnd(.4,1.1),ph:rnd(0,6.28),sp:rnd(.6,2.2)});
  var m=Math.round(W*H/30000)+8;flies=[];
  for(i=0;i<m;i++)flies.push({x:Math.random()*W,y:Math.random()*H,r:rnd(5,10),vx:rnd(-6,6),vy:-rnd(4,11),ph:rnd(0,6.28),sp:rnd(.5,1.4)});
  hearts=[];var hn=Math.round(W*H/50000)+6;
  for(i=0;i<hn;i++)hearts.push({x:Math.random()*W,y:Math.random()*H,s:rnd(5,11),vy:-rnd(10,26),ph:rnd(0,6.28),sp:rnd(.5,1.2),a:rnd(.1,.26)});
}
window.addEventListener('resize',resize);resize();

function shoot(x,y){
  var dir=Math.random()<.5?-1:1,ang=rnd(.35,.6),sp=rnd(650,950);
  if(x==null){x=dir>0?rnd(0,W*.5):rnd(W*.5,W);y=rnd(0,H*.4)}
  shoots.push({x:x,y:y,vx:Math.cos(ang)*sp*dir,vy:Math.sin(ang)*sp,t:0,max:rnd(.8,1.3)});
}

/* Flores */
var dotsEl=$('#dots'),i0;
for(i0=0;i0<lines.length;i0++)dotsEl.appendChild(document.createElement('i'));
var dotList=dotsEl.children;
var ros=Array.prototype.map.call(document.querySelectorAll('.tul'),function(el,i){
  var hd=el.querySelector('.hd'),gl=el.querySelector('.glow');
  return {el:el,hd:hd,gl:gl,i:i,a:0,v:0,k:52+(i%4)*12,c:4.4+(i%3)*.7,b:0,vb:0,g:0,done:false,
    delay:.6+i*.16,x:+hd.dataset.x,y:+hd.dataset.y,r:+hd.dataset.r,s:+hd.dataset.s,gx:+gl.dataset.x,gy:+gl.dataset.y,gk:+gl.dataset.k,infl:+el.dataset.infl}});
var lvs=Array.prototype.map.call(document.querySelectorAll('.lf,.fil'),function(el,i){
  return {el:el,i:i+3,a:0,v:0,k:34+(i%3)*10,c:3.2+(i%2)*.8,infl:+el.dataset.infl}});
var all=$('#all'),wind=0,windT=0,bqA=0,lastX=null,love=false;

function step(o,dt,target){
  var acc=o.k*(target-o.a)-o.c*o.v;o.v+=acc*dt;o.a=clamp(o.a+o.v*dt,-24,24);
}

/* Sonido */
var ac=null,muted=false,snd=$('#snd');
function chime(n){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    var fr=[392,440,493.88,587.33,659.25,783.99,880][n%7],t=ac.currentTime;
    [[1,.15],[2,.05],[4,.015]].forEach(function(p){
      var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=fr*p[0];
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p[1],t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+1.8);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.9);
    });
  }catch(e){}
}
snd.addEventListener('click',function(e){e.stopPropagation();muted=!muted;snd.textContent=muted?'🔕':'🔔';snd.setAttribute('aria-label',muted?'Sonido desactivado':'Sonido activado')});

/* Texto que se escribe */
var msg=$('#msg'),sub=$('#sub'),row=$('#row'),yes=$('#yes'),no=$('#no'),typer=null;
function type(text,cb){
  clearInterval(typer);msg.classList.remove('hint');msg.textContent='';
  var ch=Array.from(text),n=0;
  typer=setInterval(function(){n++;msg.textContent=ch.slice(0,n).join('');if(n>=ch.length){clearInterval(typer);if(cb)cb()}},34);
}

/* Efectos */
function burst(x,y,big){
  var n=calm?8:(big?26:16),i;
  for(i=0;i<n;i++){var a=rnd(-Math.PI*.95,-Math.PI*.05),sp=rnd(90,280);
    parts.push({k:0,x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:rnd(0,6.28),vr:rnd(-5,5),s:rnd(5,9),t:0,max:rnd(1.8,2.8),col:pick(['#ffc21a','#ffd75e','#ffe38a','#e6a300','#fff0b0'])})}
  for(i=0;i<(big?9:5);i++)parts.push({k:2,x:x+rnd(-24,24),y:y+rnd(-10,10),vx:rnd(-30,30),vy:-rnd(70,150),s:rnd(6,13),ph:rnd(0,6.28),t:0,max:rnd(1.6,2.6),col:pick(['#ffd75e','#ffe38a','#ffc93f','#ffb300'])});
  for(i=0;i<8;i++)parts.push({k:1,x:x+rnd(-30,30),y:y+rnd(-30,30),vx:rnd(-40,40),vy:rnd(-60,20),s:rnd(4,8),t:0,max:rnd(.7,1.3)});
}
function heartRain(){
  for(var k=0;k<9;k++)(function(k){setTimeout(function(){
    for(var j=0;j<6;j++)parts.push({k:2,x:rnd(W*.05,W*.95),y:H+10,vx:rnd(-20,20),vy:-rnd(140,300),s:rnd(8,16),ph:rnd(0,6.28),t:0,max:rnd(2.4,3.6),col:pick(['#ffd75e','#ffe38a','#ffc93f','#ffb300','#fff'])})
  },k*240)})(k);
}

/* Flujo */
var revealed=0,asked=false;
function tap(o){
  o.vb=2.4;o.g=1;o.v+=(Math.random()<.5?-1:1)*20;
  var r=o.hd.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height/2);chime(o.i);
  o.done=true;
  if(!asked&&revealed<lines.length){
    dotList[revealed].classList.add('on');type(lines[revealed]);revealed++;
    if(revealed===lines.length){asked=true;setTimeout(function(){type(QUESTION,function(){row.classList.add('show')})},3600)}
  }
}
ros.forEach(function(o){
  o.hd.addEventListener('pointerdown',function(e){e.stopPropagation();tap(o)});
  o.hd.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(o)}});
  o.hd.addEventListener('pointerenter',function(){o.g=Math.max(o.g,.5)});
});

/* Botón "Lo pienso…" que se escapa */
var dodges=0,base=null,labels=['Lo pienso…','Mmm, ¿en serio?','Piénsalo bien 🥺','Última oportunidad…','Ya casi no tienes opción…','Ya no tienes opción 😌'];
function dodge(e){
  if(e&&e.preventDefault)e.preventDefault();
  if(!row.classList.contains('show')||love)return;
  if(!base)base=no.getBoundingClientRect();
  dodges++;
  var w=Math.max(base.width,200),h=base.height,pad=14,yr=yes.getBoundingClientRect(),x,y,n=0,ok;
  do{
    x=pad+Math.random()*Math.max(10,W-w-pad*2);y=H*.5+Math.random()*Math.max(10,H*.5-h-40);
    ok=!(x<yr.right+10&&x+w>yr.left-10&&y<yr.bottom+10&&y+h>yr.top-10);n++;
  }while(!ok&&n<14);
  no.style.transform='translate('+(x-base.left).toFixed(0)+'px,'+(y-base.top).toFixed(0)+'px)';
  no.textContent=labels[Math.min(dodges,labels.length-1)];
  yes.style.transform='scale('+Math.min(1.7,1+dodges*.12).toFixed(2)+')';
  if(dodges>=6){no.style.opacity='0';no.style.pointerEvents='none';no.setAttribute('aria-hidden','true');no.tabIndex=-1}
}
no.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')dodge(e)});
no.addEventListener('pointerdown',dodge);
no.addEventListener('click',dodge);

yes.addEventListener('click',function(e){
  e.stopPropagation();if(love)return;love=true;
  row.classList.remove('show');no.style.opacity='0';no.style.pointerEvents='none';
  yes.style.pointerEvents='none';
  type('¡Sabía que dirías que sí! 💗',function(){
    sub.textContent='Escríbeme y coordinamos 😏'+(CONFIG.de?'  — '+CONFIG.de:'');sub.classList.add('on')});
  heartRain();
  [0,2,4,6,5,3].forEach(function(n,k){setTimeout(function(){chime(n)},k*140)});
  ros.forEach(function(o,k){setTimeout(function(){o.vb=2.6;o.g=1;var r=o.hd.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,true)},k*170)});
  for(var s=0;s<5;s++)setTimeout(shoot,s*300);
});

window.addEventListener('pointerdown',function(e){lastX=e.clientX;if(e.target.closest&&!e.target.closest('.hd,button'))shoot(e.clientX,e.clientY)});
window.addEventListener('pointermove',function(e){
  windT=clamp((e.clientX/W-.5)*2,-1,1)*6;
  if(lastX!=null){var dx=clamp(e.clientX-lastX,-60,60);ros.forEach(function(o){o.v+=dx*.5*o.infl});lvs.forEach(function(o){o.v+=dx*.5*o.infl})}
  lastX=e.clientX;
},{passive:true});
window.addEventListener('pointerleave',function(){lastX=null;windT=0});

/* Loop */
var last=performance.now(),t=0,nextShoot=2.5;
function frame(now){
  var dt=Math.min(.033,(now-last)/1000||.016),i,p,o;last=now;t+=dt;
  wind+=(windT-wind)*Math.min(1,dt*3);
  var idleAmp=calm?.35:1;
  for(i=0;i<ros.length;i++){o=ros[i];
    var idle=(Math.sin(t*.85+o.i*1.31)*1.6+Math.sin(t*.37+o.i*2.1)*1.1)*idleAmp;
    step(o,dt,wind*o.infl+idle);
    if(t>o.delay){o.vb+=(90*(1-o.b)-7.5*o.vb)*dt;o.b+=o.vb*dt}
    o.g+=((love?.7:0)-o.g)*Math.min(1,dt*1.6);
    var ex=clamp(-o.v*.7,-14,14),ss=o.s*Math.max(o.b,0)*(1+.014*Math.sin(t*1.5+o.i*1.9));
    o.el.setAttribute('transform','rotate('+o.a.toFixed(2)+' 300 600)');
    o.hd.setAttribute('transform','translate('+o.x+' '+o.y+') rotate('+(o.r+ex).toFixed(2)+') scale('+ss.toFixed(3)+')');
    o.gl.setAttribute('opacity',(clamp(o.b,0,1)*(.5+.45*o.g+.08*Math.sin(t*2+o.i))).toFixed(3));
    o.gl.setAttribute('transform','translate('+o.gx+' '+o.gy+') scale('+(o.gk*(1+.35*o.g)).toFixed(3)+')');
  }
  for(i=0;i<lvs.length;i++){o=lvs[i];
    step(o,dt,wind*o.infl*.8+(Math.sin(t*.8+o.i*1.7)*2.2+Math.sin(t*.31+o.i)*1.3)*idleAmp);
    o.el.setAttribute('transform','rotate('+o.a.toFixed(2)+' 300 600)');
  }
  bqA+=((wind*.28+Math.sin(t*.5)*.5*idleAmp)-bqA)*Math.min(1,dt*4);
  all.setAttribute('transform','rotate('+bqA.toFixed(2)+' 300 880)');

  /* cielo */
  if(t>nextShoot){shoot();nextShoot=t+rnd(3,7)}
  sc.clearRect(0,0,W,H);
  for(i=0;i<stars.length;i++){var s=stars[i];sc.globalAlpha=.3+.7*(.5+.5*Math.sin(t*s.sp+s.ph));
    sc.fillStyle=s.r>1.3?'#fff4cc':'#fff';sc.beginPath();sc.arc(s.x,s.y,s.r,0,6.283);sc.fill();
    if(s.r>1.3){sc.fillRect(s.x-6,s.y-.4,12,.8);sc.fillRect(s.x-.4,s.y-6,.8,12)}}
  for(i=0;i<hearts.length;i++){var hh=hearts[i];
    hh.y+=hh.vy*dt;hh.x+=Math.sin(t*hh.sp+hh.ph)*14*dt;if(hh.y<-20){hh.y=H+20;hh.x=Math.random()*W}
    sc.save();sc.translate(hh.x,hh.y);sc.globalAlpha=hh.a*(love?2:1);sc.fillStyle='#ffd75e';heartPath(sc,hh.s);sc.fill();sc.restore()}
  for(i=0;i<flies.length;i++){var fl=flies[i];
    fl.x+=(fl.vx+Math.sin(t*fl.sp+fl.ph)*10)*dt;fl.y+=fl.vy*dt;if(fl.y<-20){fl.y=H+20;fl.x=Math.random()*W}
    sc.globalAlpha=.2+.5*(.5+.5*Math.sin(t*fl.sp*1.7+fl.ph));sc.drawImage(glowSprite,fl.x-fl.r,fl.y-fl.r,fl.r*2,fl.r*2)}
  for(i=shoots.length-1;i>=0;i--){var sh=shoots[i];sh.t+=dt;if(sh.t>sh.max){shoots.splice(i,1);continue}
    sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;var a=1-Math.pow(sh.t/sh.max,2),mag=Math.hypot(sh.vx,sh.vy),tx=sh.x-sh.vx/mag*150,ty=sh.y-sh.vy/mag*150;
    var g=sc.createLinearGradient(sh.x,sh.y,tx,ty);g.addColorStop(0,'rgba(255,244,200,'+a.toFixed(3)+')');g.addColorStop(1,'rgba(255,210,63,0)');
    sc.globalAlpha=1;sc.strokeStyle=g;sc.lineWidth=2;sc.lineCap='round';sc.beginPath();sc.moveTo(sh.x,sh.y);sc.lineTo(tx,ty);sc.stroke();
    sc.globalAlpha=a;sc.drawImage(glowSprite,sh.x-11,sh.y-11,22,22)}
  sc.globalAlpha=1;

  /* partículas */
  fc.clearRect(0,0,W,H);
  for(i=parts.length-1;i>=0;i--){p=parts[i];p.t+=dt;if(p.t>=p.max){parts.splice(i,1);continue}
    var u=p.t/p.max;
    fc.save();fc.translate(p.x,p.y);
    if(p.k===0){p.vy+=240*dt;p.vx*=1-1.2*dt;p.vy*=1-.6*dt;p.x+=p.vx*dt+Math.sin(p.t*4+p.rot)*10*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
      fc.rotate(p.rot);fc.globalAlpha=1-u*u;fc.fillStyle=p.col;fc.beginPath();fc.ellipse(0,0,p.s,p.s*.6,0,0,6.283);fc.fill()}
    else if(p.k===2){p.x+=(p.vx+Math.sin(p.t*3+p.ph)*24)*dt;p.y+=p.vy*dt;p.vy*=1-.5*dt;
      fc.globalAlpha=u<.15?u/.15:1-Math.pow((u-.15)/.85,2);fc.fillStyle=p.col;heartPath(fc,p.s);fc.fill()}
    else{p.x+=p.vx*dt;p.y+=p.vy*dt;fc.globalAlpha=(1-u)*(.6+.4*Math.sin(p.t*18));fc.fillStyle='#fff7c2';star4(fc,p.s*(1-u*.5));fc.fill()}
    fc.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
